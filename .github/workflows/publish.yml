name: Publish to npm

# Publishes the package when a GitHub Release is published (or manually from
# the Actions tab). Requires an npm automation token stored as the repository
# secret NPM_TOKEN: https://www.npmjs.com/settings/<user>/tokens
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Run unit tests
        run: node --test test/*.test.mjs
      - name: Publish package
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
